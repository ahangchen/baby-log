<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>带娃记录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主界面 -->
<div id="page-main" class="page active">
  <div class="topbar">
    <button class="review-btn" onclick="showPage('page-calendar');renderCal();renderMilkChart()">📖 事件回顾</button>
    <div style="font-size:18px;font-weight:bold">带娃记录</div>
    <div style="width:70px"></div>
  </div>
  <div class="btn-grid">
    <button class="ev-btn ev-milk" onclick="openForm('milk')">🍼 喝奶</button>
    <button class="ev-btn ev-diaper" onclick="openForm('diaper')">🧷 换尿布</button>
    <button class="ev-btn ev-sleep" onclick="openForm('sleep')">😴 睡觉</button>
    <button class="ev-btn ev-bath" onclick="openForm('bath')">🛁 洗澡</button>
    <button class="ev-btn ev-play" onclick="openForm('play')">🧸 玩耍</button>
    <button class="ev-btn ev-out" onclick="openForm('out')">🚗 外出</button>
  </div>
</div>

<!-- 事件详情表单 -->
<div id="page-form" class="page">
  <div class="topbar">
    <button class="back" onclick="showPage('page-main')">‹ 返回</button>
    <h2 id="form-title">事件</h2>
    <div style="width:50px"></div>
  </div>
  <div class="form-item">
    <label>开始时间</label>
    <input type="datetime-local" id="f-start">
  </div>
  <div class="form-item">
    <label>结束时间</label>
    <input type="datetime-local" id="f-end">
  </div>
  <div id="f-extra"></div>
  <button class="save-btn" onclick="saveEvent()">保存</button>
  <div class="tip" id="save-tip"></div>
</div>

<!-- 日历 -->
<div id="page-calendar" class="page">
  <div class="topbar">
    <button class="back" onclick="showPage('page-main')">‹ 返回</button>
    <h2>事件回顾</h2>
    <div style="width:50px"></div>
  </div>
  <div class="cal-head">
    <button onclick="calMove(-1)">‹</button>
    <div id="cal-title" style="font-size:17px;font-weight:bold"></div>
    <button onclick="calMove(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <h3>最近 7 天总奶量 (ml)</h3>
  <div id="milk-chart"></div>
</div>

<!-- 日汇总 -->
<div id="page-day" class="page">
  <div class="topbar">
    <button class="back" onclick="showPage('page-calendar')">‹ 返回</button>
    <h2 id="day-title"></h2>
    <div style="width:50px"></div>
  </div>
  <div id="day-summary"></div>
  <h3>事件列表</h3>
  <div id="day-list"></div>
</div>

<!-- 事件详情 -->
<div id="page-detail" class="page">
  <div class="topbar">
    <button class="back" onclick="showPage('page-day')">‹ 返回</button>
    <h2 id="detail-title"></h2>
    <button class="back" style="color:#e0427f" onclick="deleteEvent()">删除</button>
  </div>
  <div id="detail-body"></div>
</div>

<script src="app.js"></script>
</body>
</html>
